name: Build Naultinus (Windows)

on:
  push:
    branches: [ main, master, "claude/**" ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.112'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-

      - name: Restore dependencies
        run: dotnet restore Naultinus.sln

      - name: Check NuGet vulnerabilities
        shell: pwsh
        run: |
          $out = dotnet list Naultinus.sln package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Host $out
          if ($out -match '(?i)Severity\s+Advisory|has the following vulnerable') {
            if ($out -match '(?i)\b(Critical|High)\b') {
              throw 'Vulnerable NuGet packages with Critical/High severity detected.'
            }
            Write-Warning 'Vulnerable packages reported (Moderate/Low) — review advisory output above.'
          }

      - name: Run tests
        run: dotnet test Naultinus.Tests/Naultinus.Tests.csproj -c Debug --no-restore

      - name: Build (Release)
        run: dotnet build Naultinus.Application/Naultinus.Application.csproj -c Release --no-restore

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Naultinus-win-x64
          path: Naultinus.Application/bin/Release/
          retention-days: 14
